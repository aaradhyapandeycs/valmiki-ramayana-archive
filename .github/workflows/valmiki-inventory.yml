name: Valmiki source inventory
on:
  push:
    paths: ['.github/workflows/valmiki-inventory.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: valmiki-source-inventory
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - name: Inventory source URLs and reconcile chapter indexes
        run: |
          python3 inventory.py --self-test
          python3 inventory.py --fresh --output audit/primary --max-pages 30000 --max-seconds 4500 --delay 0.1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: primary-source-inventory
          path: audit/primary
          if-no-files-found: error
