name: Build and deploy
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Preserve source inventory snapshots"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      inventory_run_id:
        description: Successful run of the original URL inventory
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      REQUESTED_INVENTORY: ${{ inputs.inventory_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Load archived Sanskrit
        uses: actions/checkout@v4
        with:
          ref: 'b674a55c67ad0de3513c4e04e5b30e2d0dc7e1ad'
          path: data/sanskrit
          persist-credentials: false
      - name: Load the original 1910 introduction
        uses: actions/checkout@v4
        with:
          ref: '57b40a93e97e6a17c1a7f361cf672c0255dc8b08'
          path: data/ayyangar
          persist-credentials: false
      - name: Select a preserved inventory
        id: audit
        run: |
          if [ -n "$REQUESTED_INVENTORY" ]; then
            [[ "$REQUESTED_INVENTORY" =~ ^[0-9]+$ ]]
            printf 'run_id=%s\n' "$REQUESTED_INVENTORY" >> "$GITHUB_OUTPUT"
          else
            ref=$(git ls-remote origin refs/heads/recursive-inventory-snapshot | cut -f1)
            if [ -z "$ref" ]; then
              ref=$(git ls-remote origin refs/heads/partial-inventory-snapshot | cut -f1)
            fi
            if [ -z "$ref" ]; then
              ref=73199ff97ff058d1e932a990da2866f8acdd60d6
            fi
            [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
            printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"
          fi
      - name: Load the preserved URL inventory
        if: steps.audit.outputs.ref != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.audit.outputs.ref }}
          path: audit/primary
          persist-credentials: false
      - name: Load a manually selected recursive audit
        if: steps.audit.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: primary-source-inventory
          path: audit/primary
          run-id: ${{ steps.audit.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Load verified chapter directory listings
        uses: actions/checkout@v4
        with:
          ref: '73199ff97ff058d1e932a990da2866f8acdd60d6'
          path: audit/directories
          persist-credentials: false
      - name: Verify the recorded Sanskrit snapshot
        run: python3 verify_capture.py data/sanskrit --commit 89e2ac54cb045ff189f5ea06abc0867dab85f010
      - name: Reconcile observed source URLs
        run: |
          audit=audit/original
          if [ -f audit/primary/summary.json ]; then
            audit=audit/primary
          fi
          python3 build_variant_inventory.py "$audit" data/frames.json data/variants.json --listing-samples data/listing-samples.json --directory-audit audit/directories
      - name: Build and validate
        run: |
          python3 build.py
          python3 -m unittest test_transliterate_iast
          python3 verify_iast.py
          python3 verify_dutt_render.py
          python3 build_source_manifest.py
          python3 verify.py
          bash iast_font_assets.sh dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify all published chapter routes
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 validate_live.py "$LIVE_URL" 534
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-file-audit
          path: live-audit-report.json
          if-no-files-found: ignore
