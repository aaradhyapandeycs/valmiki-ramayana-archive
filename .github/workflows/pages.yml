name: Build and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      inventory_run_id:
        description: Successful run of the original URL inventory
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      SANSKRIT_RUN_ID: '43561258233'
      INVENTORY_RUN_ID: ${{ inputs.inventory_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Load archived Sanskrit
        uses: actions/download-artifact@v4
        with:
          name: source-sanskrit
          path: data/sanskrit
          run-id: ${{ env.SANSKRIT_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Load the full URL audit
        if: env.INVENTORY_RUN_ID != ''
        uses: actions/download-artifact@v4
        with:
          name: primary-source-inventory
          path: audit/primary
          run-id: ${{ env.INVENTORY_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Verify the recorded Sanskrit snapshot
        run: python3 verify_capture.py data/sanskrit --commit f593b61f4d9689b0409d7d6e419abf9b75d99fe8
      - name: Reconcile observed source URLs
        run: |
          audit=audit/original
          if [ -f audit/primary/summary.json ]; then
            audit=audit/primary
          fi
          python3 build_variant_inventory.py "$audit" data/frames.json data/variants.json --listing-samples data/listing-samples.json
      - name: Build and validate
        run: |
          python3 build.py
          python3 verify.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
