name: Preserve the 1910 Ayyangar introduction
on:
  push:
    branches: [main]
    paths: ['.github/workflows/preserve-intro.yml', 'fetch_intro.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: preserve-introduction
  cancel-in-progress: false
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify scans and provenance
        run: |
          python3 -m pip install pypdf
          python3 fetch_intro.py --output-dir "$RUNNER_TEMP/verified-introduction"
      - name: Preserve introduction on a dedicated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch=ayyangar-snapshot
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null; then
            git fetch --no-tags origin "refs/heads/$branch"
            git switch --detach FETCH_HEAD
          else
            lookup_status=$?
            test "$lookup_status" -eq 2
            git switch --orphan "$branch"
          fi
          cp "$RUNNER_TEMP/verified-introduction/"* .
          git add -- vr_intro_ayyangar.pdf vr_intro_ayyangar.json
          if ! git diff --cached --quiet; then
            git commit -m "Preserve the 1910 Ayyangar introduction facsimile"
          fi
          git push origin "HEAD:refs/heads/$branch"
