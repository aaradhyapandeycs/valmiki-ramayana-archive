name: Capture the Sanskrit source
on:
  push:
    branches: [main]
    paths:
      - 'ingest_sanskrit.py'
      - '.github/workflows/sanskrit-capture.yml'
  workflow_dispatch:
    inputs:
      previous_run_id:
        description: 'Reuse verified primary records from this completed capture run'
        required: false
        type: string
permissions:
  actions: read
  contents: read
concurrency:
  group: capture-sanskrit
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: source-sanskrit
          path: ${{ runner.temp }}/previous-sanskrit
          github-token: ${{ github.token }}
          run-id: ${{ inputs.previous_run_id || '43561872819' }}
      - name: Capture numbered Sanskrit verses
        env:
          PREVIOUS_RUN_ID: ${{ inputs.previous_run_id || '43561872819' }}
        run: |
          extra=()
          if [[ -n "$PREVIOUS_RUN_ID" ]]; then
            python3 verify_capture.py "$RUNNER_TEMP/previous-sanskrit"
            extra+=(--previous "$RUNNER_TEMP/previous-sanskrit")
          fi
          python3 ingest_sanskrit.py --output sanskrit --commit "$GITHUB_SHA" "${extra[@]}"
          python3 verify_capture.py sanskrit --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: source-sanskrit
          path: sanskrit
          if-no-files-found: error
          retention-days: 90
