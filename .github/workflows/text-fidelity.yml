name: Audit Sanskrit text against the original
on:
  workflow_run:
    workflows: ["Build and deploy"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-text-fidelity
  cancel-in-progress: true
jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Load the pinned Sanskrit text
        uses: actions/checkout@v4
        with:
          ref: b674a55c67ad0de3513c4e04e5b30e2d0dc7e1ad
          path: data/sanskrit
          persist-credentials: false
      - name: Load the verified English source reference index
        run: |
          ref=67e4e51efc9e22cfd24ed6dae13fa4fdce9ecb91
          git fetch --no-tags --depth=1 origin "$ref"
          git show "$ref:prose-links.json" > data/prose-links.json
      - name: Install the independent HTML5 parser
        run: python3 -m pip install html5lib==1.1
      - name: Verify every captured and rendered chapter
        run: |
          python3 verify_capture.py data/sanskrit --commit 89e2ac54cb045ff189f5ea06abc0867dab85f010
          python3 build.py
          args=()
          if [ -f data/sanskrit-paratext-reviewed.json ]; then
            args+=(--paratext data/sanskrit-paratext-reviewed.json)
          fi
          python3 audit_source_text.py --snapshot data/sanskrit --build dist "${args[@]}" \
            --destination https://aaradhyapandeycs.github.io/valmiki-ramayana-archive/ \
            --output text-audit/primary-source-text.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: primary-source-text-audit
          path: text-audit/
          if-no-files-found: error
