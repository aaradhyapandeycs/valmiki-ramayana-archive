name: Verify reader layout and IAST search
on:
  workflow_run:
    workflows: ["Build and deploy"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AXE_PATH: .reader-checks/node_modules/axe-core/axe.min.js
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium and automated accessibility checks
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
          npm install --no-save --ignore-scripts --prefix .reader-checks axe-core@4.10.3
      - name: Check browser routes, accessibility, typography and downloads
        run: python3 smoke_site.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-browser-audit
          path: smoke-artifacts
          if-no-files-found: ignore
